services:
  api:
    build:
      # Build context must be the monorepo root so the Dockerfile can copy
      # pnpm-workspace.yaml, package.json, pnpm-lock.yaml and packages/shared.
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: oynk-api:latest
    env_file: .env
    environment:
      API_PORT: "4020"
    # Host networking lets the API reach Postgres at 127.0.0.1:5433
    # exactly as configured in the repo-root .env. Requires Linux (VPS).
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:4020/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
