services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oynk_dashboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Loopback-only so postgres is never exposed to the internet.
    # The API reaches it via the host network at 127.0.0.1:5433.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - oynk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oynk_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      # Build context must be the monorepo root so the Dockerfile can copy
      # pnpm-workspace.yaml, package.json, pnpm-lock.yaml and packages/shared.
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: oynk-api:latest
    env_file: .env
    environment:
      API_PORT: "4020"
    # Host networking lets the API reach Postgres at 127.0.0.1:5433
    # exactly as configured in the repo-root .env. Requires Linux (VPS).
    network_mode: host
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:4020/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  oynk_postgres:
